version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: xcyl-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: xcyl_h5
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - xcyl-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: xcyl-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=xcyl_h5
      - DB_PORT=3306
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - xcyl-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: xcyl-client
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - xcyl-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: xcyl-admin
    restart: always
    ports:
      - "5174:5174"
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - xcyl-network

volumes:
  mysql_data:

networks:
  xcyl-network:
    driver: bridge
